name: Publicar Zernio validado
on:
  push:
    branches: [zernio-identidad-respuesta]
    paths: [.github/workflows/publicar-zernio.yml]
permissions:
  contents: read
concurrency:
  group: zernio-release-nea-agent
  cancel-in-progress: false
jobs:
  imagen:
    if: github.repository == 'Dwarvesmx/nea-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: aefc25c4e2c2478c44443ae7edd3dc850474353e
      IMAGE: ghcr.io/dwarvesmx/nea-agent
      VERSION: 2.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aefc25c4e2c2478c44443ae7edd3dc850474353e
          persist-credentials: false
      - name: Comprobar fuente exacta
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dwarvesmx/nea-agent:2.0.2-zernio-aefc25c4e2c2478c44443ae7edd3dc850474353e
          labels: |
            org.opencontainers.image.source=https://github.com/Dwarvesmx/nea-agent
            org.opencontainers.image.revision=aefc25c4e2c2478c44443ae7edd3dc850474353e
            org.opencontainers.image.version=2.0.2
          build-args: |
            SOURCE_COMMIT=aefc25c4e2c2478c44443ae7edd3dc850474353e
            NEA_VERSION=2.0.2
          provenance: mode=max
          sbom: true
      - name: Verificar artefacto publicado
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          REF="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$REF" | tee manifest.txt
          docker pull --platform linux/amd64 "$REF"
          docker image inspect "$REF" > image-inspect.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('image-inspect.json'))[0]
          assert x['Os']=='linux' and x['Architecture']=='amd64'
          labels=x['Config']['Labels']
          assert labels['org.opencontainers.image.revision']==os.environ['SOURCE_SHA']
          assert labels['org.opencontainers.image.version']==os.environ['VERSION']
          env=dict(s.split('=',1) for s in x['Config']['Env'])
          for key in ('ZERNIO_WHATSAPP_ENABLED','ZERNIO_NEA_AUTO_ENABLED','ZERNIO_NEA_DISPATCH_ENABLED','NEA_DURABLE_RESPONSE_IDS'):
              assert env.get(key,'false').lower()!='true'
          assert env['NEA_VERSION']==os.environ['VERSION']
          assert env['NEA_BUILD_COMMIT']==os.environ['SOURCE_SHA']
          PY
          echo "$REF" | tee image-reference.txt
          printf '### Imagen verificada\n\n%s\n\nFuente: %s\n\nPlataforma: linux/amd64\n' "$REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidencia-nea-agent-aefc25c4e2c2478c44443ae7edd3dc850474353e
          path: |
            manifest.txt
            image-inspect.json
            image-reference.txt
          retention-days: 30

